<!-- ============================================================================
     Site header — edit this file, then run `npm run partials` to sync it into
     every page between the @partial:header markers. Never edit the copies.

     Two tiers, the way a paper of the period set a page with this many
     sections: the nameplate on top, the section bar beneath a rule.
     ========================================================================= -->
<a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>

<header id="site-header"
        class="sticky top-0 z-50 border-b-[3px] border-ink bg-canvas/90 backdrop-blur-md
               after:absolute after:inset-x-0 after:top-full after:mt-px after:border-t
               after:border-ink">

  <!-- ---------------------------------------------------------- nameplate -->
  <div class="container-x">
    <div class="grid h-16 grid-cols-[1fr_auto_1fr] items-center gap-4 sm:h-[4.5rem]">

      <div class="flex items-center justify-self-start">
        <button type="button" data-menu-toggle aria-expanded="false" aria-controls="mobile-menu"
                class="btn-icon -ms-2 md:hidden" aria-label="Open menu">
          <svg data-menu-icon="closed" class="h-5 w-5" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M3.5 7h17M3.5 12h17M3.5 17h17"></path>
          </svg>
          <svg data-menu-icon="open" class="h-5 w-5" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" hidden>
            <path d="M5.5 5.5l13 13M18.5 5.5l-13 13"></path>
          </svg>
        </button>
      </div>

      <a href="/home/" class="group flex items-center gap-2.5 justify-self-center sm:gap-3"
         data-i18n-attr="aria-label:nav.home.aria" aria-label="Almail Family — home">
        <span class="flex h-7 w-7 items-center justify-center border border-ink bg-ink
                     font-display text-[13px] font-semibold text-invert transition-colors
                     group-hover:bg-canvas group-hover:text-ink sm:h-8 sm:w-8 sm:text-sm">A</span>
        <span class="wordmark font-display text-[15px] font-semibold uppercase tracking-[0.26em]
                     sm:text-[17px]" data-i18n="brand.family">Almail</span>
      </a>

      <div class="flex items-center justify-self-end gap-1 sm:gap-2">
        <button type="button" data-lang-toggle
                class="btn-ghost min-w-14 justify-center px-2 text-[13px] font-medium sm:min-w-16 sm:px-3"
                lang="ar" aria-label="Switch language">العربية</button>

        <button type="button" data-theme-toggle class="btn-icon" aria-label="Switch colour scheme">
          <svg data-theme-icon="light" class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.25"></circle>
            <path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4l1.4-1.4M18 6l1.4-1.4"></path>
          </svg>
          <svg data-theme-icon="dark" class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" hidden>
            <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- -------------------------------------------------------- section bar -->
  <div class="hidden border-t border-line md:block">
    <div class="container-x">
      <nav class="flex flex-wrap items-center justify-center gap-x-7 gap-y-1 py-2.5"
           data-i18n-attr="aria-label:nav.sections" aria-label="Sections">
        <a class="nav-link section-link" href="/blog/?category=Articles" data-i18n="nav.article">Article</a>
        <a class="nav-link section-link" href="/heritage/" data-i18n="nav.history">History</a>
        <a class="nav-link section-link" href="/directory/" data-i18n="nav.characters">Characters</a>
        <a class="nav-link section-link" href="/pictures/" data-i18n="nav.pictures">Pictures</a>
        <a class="nav-link section-link" href="/resources/" data-i18n="nav.resources">Resources</a>
        <a class="nav-link section-link" href="/family-tree/" data-i18n="nav.tree">Family tree</a>
        <a class="nav-link section-link" href="/blog/" data-i18n="nav.news">News</a>
        <a class="nav-link section-link" href="/location/" data-i18n="nav.location">Location</a>
        <a class="nav-link section-link" href="/contact/" data-i18n="nav.contactUs">Contact us</a>
      </nav>
    </div>
  </div>

  <!-- ------------------------------------------------- mobile section list -->
  <div id="mobile-menu" hidden class="border-t border-line bg-canvas md:hidden">
    <nav class="container-x grid grid-cols-2 gap-x-6 py-2"
         data-i18n-attr="aria-label:nav.sections" aria-label="Sections">
      <a class="nav-link border-b border-line py-3.5 text-[15px] font-medium" href="/blog/?category=Articles" data-i18n="nav.article">Article</a>
      <a class="nav-link border-b border-line py-3.5 text-[15px] font-medium" href="/heritage/" data-i18n="nav.history">History</a>
      <a class="nav-link border-b border-line py-3.5 text-[15px] font-medium" href="/directory/" data-i18n="nav.characters">Characters</a>
      <a class="nav-link border-b border-line py-3.5 text-[15px] font-medium" href="/pictures/" data-i18n="nav.pictures">Pictures</a>
      <a class="nav-link border-b border-line py-3.5 text-[15px] font-medium" href="/resources/" data-i18n="nav.resources">Resources</a>
      <a class="nav-link border-b border-line py-3.5 text-[15px] font-medium" href="/family-tree/" data-i18n="nav.tree">Family tree</a>
      <a class="nav-link border-b border-line py-3.5 text-[15px] font-medium" href="/blog/" data-i18n="nav.news">News</a>
      <a class="nav-link border-b border-line py-3.5 text-[15px] font-medium" href="/location/" data-i18n="nav.location">Location</a>
      <a class="nav-link py-3.5 text-[15px] font-medium" href="/contact/" data-i18n="nav.contactUs">Contact us</a>
    </nav>
  </div>

  <!-- ------------------------------------------------------ ornament band -->
  <!-- Full-bleed, so it runs the width of the page like a printed border.
       Last child, so it stays at the foot of the masthead when the mobile
       section list opens above it. Decorative. -->
  <div class="header-band" aria-hidden="true"></div>
</header>
