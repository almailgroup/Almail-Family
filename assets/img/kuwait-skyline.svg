  <path fill-rule="evenodd" d="M1876 326 h180 v72 h-180 z
    M1950 398 L1950 360 Q 1966 336 1982 360 L1982 398 Z
    M1902 352 h20 v20 h-20 z
    M2010 352 h20 v20 h-20 z"/>
