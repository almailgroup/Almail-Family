<!-- ========================================= 8. AL SHAHEED PARK (x 2090–2370) -->
<g id="shaheed-park">
  <!-- the park's raised ground -->
  <path d="M2090 398 Q 2150 380 2230 378 Q 2310 376 2370 398 Z"/>
  <!-- the memorial arch, cut as a ring -->
  <path d="M2160 378 L2160 342 Q 2196 306 2232 342 L2232 378 L2214 378 L2214 350
           Q 2196 330 2178 350 L2178 378 Z"/>
  <!-- trees -->
  <path d="M2117 344 h6 v34 h-6 z"/>
  <ellipse cx="2120" cy="326" rx="24" ry="22"/>
  <path d="M2267 336 h7 v42 h-7 z"/>
  <ellipse cx="2270" cy="314" rx="30" ry="26"/>
  <path d="M2327 350 h6 v28 h-6 z"/>
  <ellipse cx="2330" cy="332" rx="22" ry="20"/>
</g>

<!-- the horizon everything stands on -->
<path d="M0 396 h2400 v4 h-2400 z"/>
</svg>
