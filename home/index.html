<!DOCTYPE html>
<!-- ============================================================================
     The homepage moved to the bare domain, so that a search for the family
     shows "almailfamily.com" rather than "almailfamily.com › home", and so the
     address people type is the address that is indexed. This is all that is
     left here: anything still pointing at /home/ — an old link, a bookmark,
     the copy Google already holds — lands on it and is sent on, and the
     canonical tells a crawler which of the two is the real one.
     ========================================================================= -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Almail Family</title>
  <link rel="canonical" href="https://almailfamily.com/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=/">
  <script>location.replace("/" + location.search + location.hash);</script>
</head>
<body>
  <p>Redirecting to <a href="/">the Almail family portal</a>.</p>
</body>
</html>
