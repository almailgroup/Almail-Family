<!DOCTYPE html>
<!-- ============================================================================
     The bare domain sends visitors to /home/, so the portal has exactly one
     homepage URL rather than two serving the same page. The meta refresh does
     the work with JavaScript off; the script carries any query or hash across.
     ========================================================================= -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Almail Family</title>
  <link rel="canonical" href="https://almailfamily.com/home/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=/home/">
  <script>location.replace("/home/" + location.search + location.hash);</script>
</head>
<body>
  <p>Redirecting to <a href="/home/">the Almail family portal</a>.</p>
</body>
</html>
